# Host-local blocks (command_allowlist, onboarding, secrets, skills, terminal) are kept on the host and omitted here.
model:
  provider: murakumo
  base_url: https://api.murakumo.cloud/v1
  default: mishima
  key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
  max_tokens: 1024
  context_length: 131072
providers:
  murakumo:
    base_url: https://api.murakumo.cloud/v1
    api_mode: chat_completions
    models:
      mishima:
        context_length: 131072
        max_tokens: 1024
      nex-n2.5-mini-uncensored:
        context_length: 65536
        max_tokens: 8192
    stale_timeout_seconds: 600
    request_timeout_seconds: 900
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    extra_headers:
      HTTP-Referer: https://itonami.cloud
      X-OpenRouter-Title: Itonami By KotobaLabs
      X-Title: Itonami By KotobaLabs
  openrouter-free:
    base_url: https://openrouter.ai/api/v1
    api_mode: chat_completions
    key_env: OPENROUTER_API_KEY
    stale_timeout_seconds: 600
    extra_headers:
      HTTP-Referer: https://itonami.cloud
      X-OpenRouter-Title: Itonami By KotobaLabs
      X-Title: Itonami By KotobaLabs
  custom:
    models:
      glm-5.3-flash-cybersecurity-w4a16:
        stale_timeout_seconds: 2400
        timeout_seconds: 2400
      qwen3.8-flash-next-cybersecurity-nvfp4:
        stale_timeout_seconds: 2000
        timeout_seconds: 2000
  kotoba:
    base_url: https://api.kotoba.cloud/v1
    api_mode: chat_completions
    key_env: KOTOBA_API_TOKEN
    stale_timeout_seconds: 600
    request_timeout_seconds: 900
    models:
      qwen3.8-27b-whitehacker:
        context_length: 262144
      qwen3.8-flash-next-whitehacker:
        context_length: 131072
fallback_providers: []
web:
  backend: nous
browser:
  cloud_provider: nous
context_file_max_chars: 120000
auxiliary:
  free_only: true
  vision:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: qwen3-vl-2b-instruct
    reasoning_effort: none
    fallback_chain: []
  web_extract:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    fallback_chain: []
  compression:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    context_length: 131072
    reasoning_effort: none
    fallback_chain: []
  skills_hub:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    fallback_chain: []
  approval:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    fallback_chain: []
  mcp:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    fallback_chain: []
  title_generation:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    reasoning_effort: none
    fallback_chain: []
  triage_specifier:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    model: mishima
    fallback_chain: []
dashboard:
  turn_isolation: true
tts:
  provider: nous
wake_word:
  enabled: false
moa:
  presets:
    default:
      reference_models:
        - provider: murakumo
          model: mishima
          enabled: true
          base_url: https://api.murakumo.cloud/v1
          key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
      aggregator:
        provider: murakumo
        model: mishima
        base_url: https://api.murakumo.cloud/v1
        key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: murakumo
      model: mishima
      enabled: true
      base_url: https://api.murakumo.cloud/v1
      key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
  aggregator:
    provider: murakumo
    model: mishima
    base_url: https://api.murakumo.cloud/v1
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
  degraded_reference_policy: loud
  max_tokens: 1024
  fanout: user_turn
  enabled: true
plugins:
  enabled: []
gateway:
  cron_only: true
  multiplex_profiles: true
_config_version: 46
image_gen:
  provider: nous
agent:
  max_turns: 500
  run_budget_seconds: 600



cron:
  bot_chat_delivery_timeout_seconds: 900
  max_parallel_jobs: 12
mcp_servers:
  github-forest:
    command: /opt/homebrew/bin/node
    args:
      - ${userHome}/github/com-junkawasaki/west-manifest/scripts/forest-maintenance.mjs
      - mcp
    lazy: true
